# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  # Enable version updates for github actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Enable version updates for npm
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # Pinned for NativeWind v5 / react-native-css: >1.30.1 breaks native
      # bundling with "failed to deserialize ... Specifier, found ()".
      # See nativewind#1605, #1613, #1632. Unpin only after verifying
      # `bun expo export:embed --eager --platform android --dev false`.
      - dependency-name: "lightningcss"

  # Enable version updates for go
  # - package-ecosystem: gomod
  #   directory: "/"
  #   schedule:
  #     interval: "monthly"

  # Enable version updates for npm
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule:
  #     interval: "monthly"

  # Enable version updates for Docker
