name: Weekly Release Train (Quota-Safe)

# Batch all merged releases into ~1 cloud build/week (Tue 14:00 UTC, off-peak).
# JS-only changes ship via EAS Update (no build quota). Native changes trigger
# at most one gated cloud build. Free plan: 15 Android + 15 iOS builds/mo.
# Manual hotfix: workflow_dispatch with platform + dry_run=false.

on:
  schedule:
    - cron: "0 14 * * TUE"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform for native rebuild (if needed)"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - all
      dry_run:
        description: "Detect + report only (no update, no cloud build)"
        required: true
        default: false
        type: boolean

concurrency:
  group: eas-train
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Validation Suite
        run: bun run validate

  detect-native-changes:
    name: Detect Native Changes (Fingerprint)
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      native_changed: ${{ steps.native.outputs.changed }}
      changed_files: ${{ steps.native.outputs.files }}
      method: ${{ steps.native.outputs.method }}
      base_hash: ${{ steps.native.outputs.base_hash }}
      head_hash: ${{ steps.native.outputs.head_hash }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies (for fingerprint compare)
        run: bun install --frozen-lockfile

      - name: "Compare fingerprint against last tag (fallback: path filter)"
        id: native
        env:
          TRAIN_PLATFORM: ${{ github.event.inputs.platform || 'android' }}
        run: |
          node ./scripts/fingerprint-diff.mjs --platform "$TRAIN_PLATFORM" --github-output
          FILES=$(git diff --name-only "$(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~1)"...HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  quota-check:
    name: Quota Check (Observability)
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      quota_status: ${{ steps.quota.outputs.quota_status }}
      request_ok: ${{ steps.quota.outputs.request_ok }}
      android_remaining: ${{ steps.quota.outputs.android_remaining }}
      ios_remaining: ${{ steps.quota.outputs.ios_remaining }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Report quota usage vs monthly budget
        id: quota
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          REQUEST_PLATFORM: ${{ github.event.inputs.platform || 'android' }}
        run: |
          node ./scripts/eas-quota.mjs --platform all --request "$REQUEST_PLATFORM" --json --github-output --summary | tail -3

  ota-update:
    name: OTA Update (No Build Quota)
    needs: [validate, detect-native-changes]
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Publish OTA to production channel
        run: |
          bun run update:production -- --message "train $(date -u +%Y-%m-%d) ${GITHUB_SHA:0:7} native_changed=$NATIVE_CHANGED"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NATIVE_CHANGED: ${{ needs.detect-native-changes.outputs.native_changed }}

  cloud-build:
    name: Gated Cloud Build (Native Changes Only)
    needs: [validate, detect-native-changes, quota-check]
    # Quota guard: only when native code actually changed, requested platform
    # still has budget, and not a dry run.
    if: ${{ needs.detect-native-changes.outputs.native_changed == 'true' && needs.quota-check.outputs.request_ok == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Quota gate (fail-closed at build time)
        run: node ./scripts/eas-quota.mjs --platform all --request "$TRAIN_PLATFORM" --fail-on-exhausted
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          TRAIN_PLATFORM: ${{ github.event.inputs.platform || 'android' }}

      - name: Build & Submit Android (Production)
        if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' || github.event.inputs.platform == '' || github.event_name == 'schedule' }}
        run: node ./scripts/eas-build-safe.mjs build --platform android --profile production --auto-submit --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS (Production)
        if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' }}
        run: node ./scripts/eas-build-safe.mjs build --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  train-summary:
    name: Train Summary
    needs: [detect-native-changes, quota-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report decision
        env:
          NATIVE_CHANGED: ${{ needs.detect-native-changes.outputs.native_changed }}
          DETECT_METHOD: ${{ needs.detect-native-changes.outputs.method }}
          BASE_HASH: ${{ needs.detect-native-changes.outputs.base_hash }}
          HEAD_HASH: ${{ needs.detect-native-changes.outputs.head_hash }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          QUOTA_STATUS: ${{ needs.quota-check.outputs.quota_status }}
          ANDROID_REMAINING: ${{ needs.quota-check.outputs.android_remaining }}
          IOS_REMAINING: ${{ needs.quota-check.outputs.ios_remaining }}
        run: |
          echo "## 🚂 Weekly Train Decision" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- native_changed: $NATIVE_CHANGED" >> "$GITHUB_STEP_SUMMARY"
          echo "- method: $DETECT_METHOD (fingerprint authoritative, path-filter fallback)" >> "$GITHUB_STEP_SUMMARY"
          echo "- base_hash: \`$BASE_HASH\` head_hash: \`$HEAD_HASH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- quota: $QUOTA_STATUS (android left: $ANDROID_REMAINING, ios left: $IOS_REMAINING)" >> "$GITHUB_STEP_SUMMARY"
          echo "- dry_run: $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "- JS-only path: OTA update only (0 builds). Native path: 1 gated build max." >> "$GITHUB_STEP_SUMMARY"
          echo "- Quota-free fallback: \`bun run build:android:local:submit\` or \`eas submit --latest --platform android\`" >> "$GITHUB_STEP_SUMMARY"
