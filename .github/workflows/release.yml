name: Release & EAS Auto-Publish (Opt-In Cloud Builds)

# Quota guard: push to main only versions + changelog via release-please.
# Cloud EAS builds run via the weekly release train (release-train.yml)
# or manual workflow_dispatch with enable_cloud_build=true.
# Prefer OTA updates (eas update) and local builds (bun run build:android:local:*)
# to stay inside the Free plan (15 Android + 15 iOS builds/mo).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build & publish"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - all
      enable_cloud_build:
        description: "Run quota-consuming EAS cloud build (otherwise version-only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please (Versioning & Changelog)
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Google Release Please Action
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-eas:
    name: Build & Auto-Publish to Stores via EAS (Manual Opt-In Only)
    needs: release-please
    # Quota guard: never auto-build on push. Only manual dispatch with explicit opt-in.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_cloud_build == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Validation Suite
        run: bun run validate

      - name: Build & Submit Android App Bundle (Production)
        if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' }}
        run: node ./scripts/eas-build-safe.mjs build --platform android --profile production --auto-submit --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS App (Production - Manual Trigger Only)
        if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' }}
        run: node ./scripts/eas-build-safe.mjs build --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  version-only-notice:
    name: Version-Only Notice (No Cloud Build)
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Point to weekly train
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          echo "Release $TAG_NAME versioned without a cloud build (quota guard)."
          echo "Cloud builds batch in the weekly train: .github/workflows/release-train.yml"
          echo "JS-only fix? Run: bun run update:production -- --message '<tag> <notes>'"
          echo "Need a binary now? Re-run this workflow manually with enable_cloud_build=true, or dispatch the train with platform=android."
