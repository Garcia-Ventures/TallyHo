name: Release & EAS Auto-Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build & publish"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - all

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please (Versioning & Changelog)
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Google Release Please Action
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-eas:
    name: Build & Auto-Publish to Stores via EAS
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Validation Suite
        run: bun run validate

      - name: Build & Submit Android App Bundle (Production)
        if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' || needs.release-please.outputs.release_created == 'true' }}
        run: eas build --platform android --profile production --auto-submit --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS App (Production - Manual Trigger Only)
        if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' }}
        run: eas build --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
